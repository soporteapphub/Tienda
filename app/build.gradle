plugins { id 'com.android.application' }

android {
    namespace 'com.dvdtecno.tienda'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dvdtecno.tienda'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../tienda.keystore')
            storePassword 'tienda123'
            keyAlias 'tienda'
            keyPassword 'tienda123'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
